# Ana uygulama ayarları

pipeline:
  timezone: "Europe/Istanbul"
  daily_run_hour: 6
  evening_run_hour: 18
  evening_run_minute: 15
  metrics_run_hour: 23

scoring:
  tier1_threshold: 70
  tier2_min: 40
  tier2_max: 70

deduplication:
  url_hash: true
  fuzzy_threshold: 90      # rapidfuzz benzerlik eşiği (0-100)
  embedding_cosine: 0.85   # cosine benzerlik eşiği

production:
  # YouTube video görünürlüğü: public | unlisted | private
  youtube_privacy: "unlisted"

content:
  # 6-8 replikli, her biri dolu (2-4 cümle) bir röportaj için makul uzunluk
  youtube_min_words: 450
  youtube_max_words: 650
  tiktok_min_words: 80
  tiktok_max_words: 130
  daily_tiktok_count: 4

intelligence:
  # Bir günde işlenecek üst sınırlar — tüm backlog'u işlemeyi önler.
  # research en yüksek skorlu tier-1/2 kümeleri, analyst en yüksek rank'li sinyalleri alır.
  research_max_clusters: 12
  analyst_max_signals: 6

llm:
  model: "gpt-4o-mini"
  # YouTube röportaj senaryosu için daha güçlü model (kalite ↑). Boş bırakılırsa ana model.
  narrative_model: "gpt-4o"
  max_tokens: 4096
  temperature: 0.3
  # Bütçe token cinsindendir ve gerçek token kullanımıyla (input+output) karşılaştırılır.
  daily_token_budget: 200000
  monthly_token_budget: 5000000

tickers:
  bist:
    indices:
      - "XU100.IS"    # BIST 100
      - "XU030.IS"    # BIST 30
    stocks:
      - "GARAN.IS"    # Garanti BBVA
      - "AKBNK.IS"    # Akbank
      - "YKBNK.IS"    # Yapı Kredi
      - "THYAO.IS"    # THY
      - "PGSUS.IS"    # Pegasus
      - "TUPRS.IS"    # Tüpraş
      - "ASELS.IS"    # Aselsan
      - "KCHOL.IS"    # Koç Holding
      - "SAHOL.IS"    # Sabancı Holding
      - "SISE.IS"     # Şişecam
  global:
    indices:
      - "^GSPC"       # S&P 500
      - "^NDX"        # Nasdaq 100
      - "^DJI"        # Dow Jones
      - "^VIX"        # VIX
    fx:
      - "USDTRY=X"    # USD/TRY
      - "EURTRY=X"    # EUR/TRY
      - "DX-Y.NYB"    # DXY
    bonds:
      - "^TNX"        # US 10Y yield
    commodities:
      - "CL=F"        # WTI Crude Oil
      - "GC=F"        # Gold
    tech:
      - "NVDA"
      - "AAPL"
      - "MSFT"
      - "META"
      - "GOOGL"

