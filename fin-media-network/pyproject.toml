[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fin-media-network"
version = "0.1.0"
description = "AI Financial Media Intelligence Network — BIST + Global"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "feedparser>=6.0.11",
    "yfinance>=0.2.40",
    "rapidfuzz>=3.9.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "ffmpeg-python>=0.2.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "fredapi>=0.5.2",
    "elevenlabs>=1.3.0",
    "google-api-python-client>=2.134.0",
    "google-auth-oauthlib>=1.2.0",
    "tweepy>=4.14.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]
